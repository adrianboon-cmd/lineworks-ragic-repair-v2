<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備報修系統</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 LINE WORKS WOFF SDK -->
    <script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/sdk/3.6.0/sdk.js"></script>
</head>
<body>
    <div class="container">
        <h2>🔧 設備報修系統</h2>
        <p class="subtitle">LINE WORKS × Ragic 設備報修平台</p>

        <!-- 報修表單 -->
        <form id="repairForm">
            <div class="form-group">
                <label for="reporter">填報人：</label>
                <input type="text" id="reporter" required placeholder="請輸入您的姓名">
            </div>

            <div class="form-group">
                <label for="equipmentName">設備名稱：</label>
                <input type="text" id="equipmentName" required placeholder="例如：印表機、冷氣、投影機">
            </div>

            <div class="form-group">
                <label for="urgency">緊急程度：</label>
                <select id="urgency">
                    <option value="一般">🟢 一般</option>
                    <option value="緊急">🟠 緊急</option>
                    <option value="非常緊急">🔴 非常緊急</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">故障描述：</label>
                <textarea id="description" rows="4" required placeholder="請詳細描述設備狀況..."></textarea>
            </div>

            <div class="form-group">
                <label for="image">上傳照片 (選填)：</label>
                <input type="file" id="image" accept="image/*">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">送出報修單</button>
        </form>

<!-- 成功送出後的結果區塊（初始隱藏） -->
<div id="resultContainer" style="display: none;" class="result-box">
    <h3>🎉 報修單已成功送出！</h3>
    <p><strong>案件編號：</strong> <span id="resRepairNo"></span></p>
    <p><strong>填報人：</strong> <span id="resReporter"></span></p>
    <p><strong>設備名稱：</strong> <span id="resEquipment"></span></p>
    <p><strong>緊急程度：</strong> <span id="resUrgency"></span></p>
    <p><strong>故障描述：</strong> <span id="resDescription"></span></p>
    <p><strong>填報時間：</strong> <span id="resTime"></span></p>
    <p class="notify-text">📩 系統已透過 LINE WORKS 機器人發送通知給您！</p>

    <!-- 申請新的報修按鈕（使用與送出按鈕相同的樣式類別 btn-submit） -->
    <div class="button-group" style="margin-top: 28px;">
        <button type="button" id="newRepairBtn" class="btn-submit">申請新的報修</button>
    </div>
</div>

    <script src="app.js"></script>
</body>
</html>
