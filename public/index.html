<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>設備報修系統</title>

    <link rel="stylesheet" href="https://static.worksmobile.net/static/wm/woff/edge/3.6/sdk.jsd>

<body>

    <div class="container">

        <div class="header">
            <h1>🔧 設備報修系統</h1>
            <p>LINE WORKS × Ragic 維修管理平台</p>
        </div>

        <div class="menu">

            <button class="menu-btn repair"
                onclick="showRepair()">
                📝 我要報修
            </button>

            <button class="menu-btn status"
                onclick="showStatus()">
                📋 進度查詢
            </button>

            <button class="menu-btn dispatch"
                onclick="showDispatch()">
                👨‍🔧 維修派工
            </button>

        </div>

        <div id="content">

            <div class="welcome-card">

                <h2>歡迎使用設備報修系統</h2>

                <p>
                    請選擇上方功能開始操作
                </p>

                <ul>
                    <li>✅ 建立設備報修案件</li>
                    <li>✅ 自動寫入 Ragic</li>
                    <li>✅ 支援 LINE WORKS WOFF</li>
                    <li>✅ 顯示案件編號</li>
                </ul>

            </div>

        </div>

    </div>

    /app.jsscript>

    <script>
        window.onload = async () => {

            try {

                await woff.init({
                    woffId: "3Wjwqq3UyBqY3x0VGQWr2Q"
                });

                console.log("WOFF Ready");

            } catch (error) {

                console.log("Browser Mode");

            }

        };
    </script>

</body>

</html>
